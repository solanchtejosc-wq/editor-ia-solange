[build]
  base = "landing"
  publish = "dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/descargas/playbook-solanch.pdf"
  to = "/descargas/cuaderno-creativo-solanch.pdf"
  status = 301
